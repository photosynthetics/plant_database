name: test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Line endings are LF
        run: |
          grep -qx '\* text=auto eol=lf' .gitattributes
          bad=$(git ls-files --eol | awk '$1=="i/crlf" || $1=="i/mixed" || $2=="w/crlf"')
          if [ -n "$bad" ]; then printf '%s\n' "$bad"; exit 1; fi

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.11.4
      - name: Dependencies
        run: dart pub get
      - name: Format
        run: bash tool/format.sh --output=none --set-exit-if-changed
      - name: Analyze (no errors, no more findings than the baseline)
        run: |
          rc=0
          out=$(dart analyze --format=machine --fatal-infos 2>&1) || rc=$?
          printf '%s\n' "$out"
          # exit codes: 0 clean, 1 infos, 2 warnings, 3 errors; anything else (64 bad input, crash) did not analyze
          case "$rc" in 0|1|2|3) ;; *) echo "dart analyze did not complete (exit $rc)"; exit 1 ;; esac
          errors=$(printf '%s\n' "$out" | grep -c '^ERROR|' || true)
          total=$(printf '%s\n' "$out" | grep -cE '^(ERROR|WARNING|INFO)\|' || true)
          echo "analyze: exit=$rc errors=$errors total=$total ceiling=0"
          if [ "$rc" -ne 0 ] && [ "$total" -eq 0 ]; then echo "exit $rc but no findings parsed"; exit 1; fi
          [ "$errors" -eq 0 ] && [ "$total" -le 0 ]
